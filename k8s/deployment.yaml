apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cicd-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: devops-cicd-app  
  template:
    metadata:
      labels:
        app: devops-cicd-app    
    spec:
      containers:
        - name: devops-cicd-app
          image: devops-cicd-app:v2
          ports:
            - containerPort: 3000        


